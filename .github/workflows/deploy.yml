# Manual deploy via GitHub Actions.
#
# GitHub Pages for this repo is configured to publish the `main` branch directly
# ("Deploy from a branch"), so pushes to main go live without this workflow and the
# generated assets (OG image, touch icon, CV PDF) are committed in assets/.
#
# This workflow is kept for the alternative setup: switch Pages to "GitHub Actions"
# as the source and run it from the Actions tab. It regenerates the assets from
# their SVG/HTML sources before publishing.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate code-built assets
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/build-assets.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
